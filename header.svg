<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 280" width="100%" height="100%">
  <defs>
    <!-- Keyframe Animations -->
    <style>
      .tech-font {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.5; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
        50% { opacity: 0.9; filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.7)); }
      }
      
      @keyframes dashFlow {
        from { stroke-dashoffset: 40; }
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes statusPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .animated-glow { animation: pulseGlow 4s ease-in-out infinite; }
      .animated-flow { stroke-dasharray: 6 6; animation: dashFlow 12s linear infinite; }
      .animated-status { animation: statusPulse 2s ease-in-out infinite; }
      .animated-float { animation: floatSlow 5s ease-in-out infinite; }
    </style>

    <!-- Background Outer Canvas Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="85%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>

    <!-- Card Background Glassmorphism Overlay -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Main Metallic Hero Text Gradient -->
    <linearGradient id="hero-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Subtitle Pill Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="33%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="66%" stop-color="#C084FC" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Node Gradient Accent -->
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="node-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Outer Container -->
  <rect width="950" height="280" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="948" height="278" rx="15" fill="none" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Geometric Grid Background Pattern -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.035">
    <path d="M 0,35 L 950,35 M 0,70 L 950,70 M 0,105 L 950,105 M 0,140 L 950,140 M 0,175 L 950,175 M 0,210 L 950,210 M 0,245 L 950,245" />
    <path d="M 70,0 L 70,280 M 140,0 L 140,280 M 210,0 L 210,280 M 280,0 L 280,280 M 350,0 L 350,280 M 420,0 L 420,280 M 490,0 L 490,280 M 560,0 L 560,280 M 630,0 L 630,280 M 700,0 L 700,280 M 770,0 L 770,280 M 840,0 L 840,280 M 910,0 L 910,280" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="120" cy="60" r="90" fill="#0284C7" opacity="0.12" filter="url(#glow-intense)"/>
  <circle cx="820" cy="140" r="110" fill="#7C3AED" opacity="0.14" filter="url(#glow-intense)"/>
  <circle cx="500" cy="240" r="80" fill="#38BDF8" opacity="0.08" filter="url(#glow-intense)"/>

  <!-- Left Accent Vertical Glow Bar -->
  <rect x="0" y="40" width="4" height="200" rx="2" fill="url(#hero-title-grad)"/>

  <!-- RIGHT SIDE: AGENTIC AI STATE GRAPH VISUALIZATION -->
  <g transform="translate(610, 20)">
    <!-- Card Frame for Graph -->
    <rect x="0" y="15" width="315" height="210" rx="12" fill="url(#card-bg)" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    
    <!-- Header of Graph Widget -->
    <text x="16" y="38" class="tech-font" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.2">LANGGRAPH AGENT STATE FLOW</text>
    <circle cx="295" cy="34" r="3" fill="#10B981" class="animated-status"/>

    <!-- Graph Connecting Lines (Edges) -->
    <!-- Input -> Router -->
    <line x1="45" y1="120" x2="110" y2="80" stroke="#38BDF8" stroke-width="1.8" opacity="0.8"/>
    <line x1="45" y1="120" x2="110" y2="160" stroke="#818CF8" stroke-width="1.8" opacity="0.8"/>
    
    <!-- Router -> Tools / RAG -->
    <line x1="110" y1="80" x2="190" y2="70" stroke="#38BDF8" stroke-width="1.5" class="animated-flow"/>
    <line x1="110" y1="160" x2="190" y2="170" stroke="#C084FC" stroke-width="1.5" class="animated-flow"/>
    
    <!-- Tools -> Evaluator Node -->
    <line x1="190" y1="70" x2="265" y2="120" stroke="#38BDF8" stroke-width="1.8" opacity="0.8"/>
    <line x1="190" y1="170" x2="265" y2="120" stroke="#C084FC" stroke-width="1.8" opacity="0.8"/>

    <!-- Conditional Loop Edge (Evaluator back to Router) -->
    <path d="M 265,120 Q 190,120 110,80" fill="none" stroke="#F472B6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.7"/>

    <!-- Graph Nodes (Circles) -->
    <!-- Node 1: User Prompt / State Input -->
    <g transform="translate(45, 120)" class="animated-float">
      <circle cx="0" cy="0" r="16" fill="url(#node-cyan)" filter="url(#glow-light)"/>
      <circle cx="0" cy="0" r="8" fill="#07090e"/>
      <text x="0" y="27" class="tech-font" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle">State Init</text>
    </g>

    <!-- Node 2: LLM Router Agent -->
    <g transform="translate(110, 80)">
      <circle cx="0" cy="0" r="18" fill="url(#node-indigo)" filter="url(#glow-light)"/>
      <text x="0" y="4" class="tech-font" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">LLM</text>
      <text x="0" y="29" class="tech-font" font-size="9" font-weight="600" fill="#38BDF8" text-anchor="middle">Router</text>
    </g>

    <!-- Node 3: RAG Retriever Tool -->
    <g transform="translate(190, 70)">
      <rect x="-16" y="-12" width="32" height="24" rx="6" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="4" class="tech-font" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">RAG</text>
      <text x="0" y="26" class="tech-font" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">Vector Search</text>
    </g>

    <!-- Node 4: Python Code Exec Tool -->
    <g transform="translate(110, 160)">
      <circle cx="0" cy="0" r="14" fill="url(#node-purple)" filter="url(#glow-light)"/>
      <text x="0" y="3" class="tech-font" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tool</text>
      <text x="0" y="25" class="tech-font" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">Python Exec</text>
    </g>

    <!-- Node 5: Output Evaluator -->
    <g transform="translate(190, 170)">
      <rect x="-18" y="-12" width="36" height="24" rx="6" fill="#7C3AED" stroke="#C084FC" stroke-width="1"/>
      <text x="0" y="4" class="tech-font" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Eval</text>
      <text x="0" y="26" class="tech-font" font-size="8" font-weight="500" fill="#94A3B8" text-anchor="middle">Guardrails</text>
    </g>

    <!-- Node 6: Final Response -->
    <g transform="translate(265, 120)">
      <circle cx="0" cy="0" r="18" fill="url(#hero-title-grad)" filter="url(#glow-light)"/>
      <circle cx="0" cy="0" r="9" fill="#0F172A"/>
      <text x="0" y="29" class="tech-font" font-size="9" font-weight="700" fill="#F472B6" text-anchor="middle">Output</text>
    </g>
  </g>

  <!-- LEFT SIDE: MAIN HERO CONTENT -->
  <g transform="translate(45, 0)">
    
    <!-- TOP PILL: Status & Role Title -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="330" height="28" rx="14" fill="url(#badge-grad)" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="16" cy="14" r="4" fill="#10B981" class="animated-status"/>
      <text x="28" y="18" class="tech-font" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1">
        AI &amp; MACHINE LEARNING ENGINEER
      </text>
    </g>

    <!-- HERO NAME -->
    <text x="0" y="112" class="tech-font" font-size="38" font-weight="900" fill="url(#hero-title-grad)" letter-spacing="-0.8" filter="url(#glow-light)">
      Aradhyula Harsha
    </text>

    <!-- TAGLINE / CORE SPECIALIZATIONS -->
    <text x="0" y="142" class="tech-font" font-size="15" font-weight="500" fill="#CBD5E1" letter-spacing="0.2">
      Generative AI • Agentic Workflows • RAG Architectures • LLM Orchestration
    </text>

    <!-- ACADEMIC & EXPERIENCE BADGE STRIP -->
    <g transform="translate(0, 160)">
      <text x="0" y="12" class="tech-font" font-size="12" font-weight="400" fill="#94A3B8">
        🎓 B.Tech AI &amp; ML (2024–2028) &nbsp;•&nbsp; 💼 GenAI Intern @ Nacre &nbsp;•&nbsp; 📍 India
      </text>
    </g>

    <!-- CORE STACK PILLS -->
    <g transform="translate(0, 194)">
      <!-- Pill 1: LangGraph -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="98" height="26" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.7"/>
        <text x="49" y="17" class="tech-font" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ LangGraph</text>
      </g>

      <!-- Pill 2: LangChain -->
      <g transform="translate(106, 0)">
        <rect x="0" y="0" width="98" height="26" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1" stroke-opacity="0.7"/>
        <text x="49" y="17" class="tech-font" font-size="11" font-weight="600" fill="#818CF8" text-anchor="middle">🦜 LangChain</text>
      </g>

      <!-- Pill 3: Google Gemini -->
      <g transform="translate(212, 0)">
        <rect x="0" y="0" width="118" height="26" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1" stroke-opacity="0.7"/>
        <text x="59" y="17" class="tech-font" font-size="11" font-weight="600" fill="#C084FC" text-anchor="middle">✨ Google Gemini</text>
      </g>

      <!-- Pill 4: Vector RAG -->
      <g transform="translate(338, 0)">
        <rect x="0" y="0" width="108" height="26" rx="6" fill="#1E293B" stroke="#F472B6" stroke-width="1" stroke-opacity="0.7"/>
        <text x="54" y="17" class="tech-font" font-size="11" font-weight="600" fill="#F472B6" text-anchor="middle">📚 RAG Systems</text>
      </g>

      <!-- Pill 5: Python -->
      <g transform="translate(454, 0)">
        <rect x="0" y="0" width="82" height="26" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1" stroke-opacity="0.7"/>
        <text x="41" y="17" class="tech-font" font-size="11" font-weight="600" fill="#10B981" text-anchor="middle">🐍 Python</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric / Certification Bar -->
  <g transform="translate(45, 248)">
    <line x1="0" y1="0" x2="860" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="18" class="tech-font" font-size="11" font-weight="500" fill="#64748B">
      CERTIFIED: <tspan fill="#CBD5E1">Oracle APEX &amp; Generative AI Professional</tspan> &nbsp;|&nbsp; <tspan fill="#CBD5E1">Google AI Essentials</tspan> &nbsp;|&nbsp; <tspan fill="#CBD5E1">IIT Kharagpur DBMS</tspan>
    </text>
  </g>
</svg>
