<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17"/>
      <stop offset="50%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="220" rx="16" fill="url(#bg-gradient)" stroke="#232b45" stroke-width="2"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 900,40 M 0,80 L 900,80 M 0,120 L 900,120 M 0,160 L 900,160 M 0,200 L 900,200" />
    <path d="M 100,0 L 100,220 M 200,0 L 200,220 M 300,0 L 300,220 M 400,0 L 400,220 M 500,0 L 500,220 M 600,0 L 600,220 M 700,0 L 700,220 M 800,0 L 800,220" />
  </g>

  <!-- Neural Network Node Connections (Right Side Accent) -->
  <g opacity="0.4">
    <!-- Lines -->
    <line x1="720" y1="50" x2="790" y2="90" stroke="#00F2FE" stroke-width="1.5" />
    <line x1="790" y1="90" x2="850" y2="60" stroke="#7928CA" stroke-width="1.5" />
    <line x1="790" y1="90" x2="820" y2="160" stroke="#FF007F" stroke-width="1.5" />
    <line x1="720" y1="50" x2="740" y2="140" stroke="#4FACFE" stroke-width="1.5" />
    <line x1="740" y1="140" x2="820" y2="160" stroke="#00F2FE" stroke-width="1.5" />
    <line x1="850" y1="60" x2="860" y2="130" stroke="#7928CA" stroke-width="1.5" />
    <line x1="820" y1="160" x2="860" y2="130" stroke="#FF007F" stroke-width="1.5" />

    <!-- Nodes -->
    <circle cx="720" cy="50" r="5" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="790" cy="90" r="7" fill="#FF007F" filter="url(#glow)"/>
    <circle cx="850" cy="60" r="4" fill="#7928CA" filter="url(#glow)"/>
    <circle cx="740" cy="140" r="6" fill="#4FACFE" filter="url(#glow)"/>
    <circle cx="820" cy="160" r="6" fill="#00F2FE" filter="url(#glow)"/>
    <circle cx="860" cy="130" r="5" fill="#FF007F" filter="url(#glow)"/>
  </g>

  <!-- Left Code Bracket Graphic Accent -->
  <g fill="none" stroke="url(#accent-gradient)" stroke-width="3" opacity="0.7">
    <path d="M 40 60 L 25 110 L 40 160" />
    <path d="M 860 60 L 875 110 L 860 160" opacity="0.3"/>
  </g>

  <!-- Main Content -->
  <!-- Top Badge / Label -->
  <rect x="60" y="32" width="220" height="26" rx="13" fill="#162238" stroke="#00F2FE" stroke-width="1"/>
  <text x="170" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00F2FE" text-anchor="middle" letter-spacing="1">
    ⚡ GEN AI &amp; AGENTIC AI
  </text>

  <!-- Name Heading -->
  <text x="60" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="url(#text-gradient)" letter-spacing="0.5">
    Aradhyula Harsha
  </text>

  <!-- Subtitle -->
  <text x="60" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    LLM Application Architect &amp; RAG Pipeline Engineer
  </text>

  <!-- Tags/Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
    <!-- Tag 1 -->
    <rect x="60" y="162" width="105" height="24" rx="6" fill="#1e183a" stroke="#FF007F" stroke-width="1"/>
    <text x="112" y="178" fill="#FF79C6" text-anchor="middle">LangChain</text>

    <!-- Tag 2 -->
    <rect x="175" y="162" width="105" height="24" rx="6" fill="#18283a" stroke="#00F2FE" stroke-width="1"/>
    <text x="227" y="178" fill="#8BE9FD" text-anchor="middle">LangGraph</text>

    <!-- Tag 3 -->
    <rect x="290" y="162" width="115" height="24" rx="6" fill="#1b2a1f" stroke="#50FA7B" stroke-width="1"/>
    <text x="347" y="178" fill="#50FA7B" text-anchor="middle">Agentic AI</text>

    <!-- Tag 4 -->
    <rect x="415" y="162" width="125" height="24" rx="6" fill="#2a2218" stroke="#FFB86C" stroke-width="1"/>
    <text x="477" y="178" fill="#FFB86C" text-anchor="middle">Gemini APIs</text>
  </g>
</svg>
