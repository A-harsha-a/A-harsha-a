<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="60%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>

    <!-- Metallic Cyan Text Gradient -->
    <linearGradient id="cyan-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="900" height="220" rx="12" fill="url(#bg)" stroke="url(#border-glow)" stroke-width="1.5"/>

  <!-- Subtle Architecture Grid -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <path d="M 0,44 L 900,44 M 0,88 L 900,88 M 0,132 L 900,132 M 0,176 L 900,176" />
    <path d="M 150,0 L 150,220 M 300,0 L 300,220 M 450,0 L 450,220 M 600,0 L 600,220 M 750,0 L 750,220" />
  </g>

  <!-- Right Side Architectural Node Network Graphic -->
  <g opacity="0.4">
    <!-- Connecting Edges -->
    <line x1="680" y1="60" x2="760" y2="100" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="760" y1="100" x2="840" y2="70" stroke="#818CF8" stroke-width="1.2" />
    <line x1="760" y1="100" x2="800" y2="160" stroke="#C084FC" stroke-width="1.2" />
    <line x1="680" y1="60" x2="710" y2="150" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="710" y1="150" x2="800" y2="160" stroke="#818CF8" stroke-width="1.2" />
    <line x1="840" y1="70" x2="850" y2="140" stroke="#C084FC" stroke-width="1.2" />

    <!-- Nodes -->
    <circle cx="680" cy="60" r="4" fill="#38BDF8" filter="url(#subtle-glow)"/>
    <circle cx="760" cy="100" r="6" fill="#818CF8" filter="url(#subtle-glow)"/>
    <circle cx="840" cy="70" r="4.5" fill="#C084FC" filter="url(#subtle-glow)"/>
    <circle cx="710" cy="150" r="5" fill="#38BDF8" filter="url(#subtle-glow)"/>
    <circle cx="800" cy="160" r="5" fill="#818CF8" filter="url(#subtle-glow)"/>
    <circle cx="850" cy="140" r="4" fill="#C084FC" filter="url(#subtle-glow)"/>
  </g>

  <!-- Left Edge Accent Line -->
  <line x1="4" y1="30" x2="4" y2="190" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

  <!-- Content Group -->
  <g transform="translate(50, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="32" width="250" height="26" rx="13" fill="#131b2e" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="45" r="4" fill="#38BDF8" />
    <text x="30" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">
      AI &amp; MACHINE LEARNING ENGINEER
    </text>

    <!-- Primary Name Heading -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#cyan-text)" letter-spacing="-0.5">
      Aradhyula Harsha
    </text>

    <!-- Subtitle / Role Description -->
    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94A3B8">
      Generative AI &amp; Agentic AI Engineer • RAG Architect • LLM Orchestration
    </text>

    <!-- Tech Stack Pill Highlights -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" transform="translate(0, 158)">
      <!-- Pill 1: LangChain -->
      <rect x="0" y="0" width="92" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="46" y="15" fill="#E2E8F0" text-anchor="middle">LangChain</text>

      <!-- Pill 2: LangGraph -->
      <rect x="100" y="0" width="92" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="146" y="15" fill="#E2E8F0" text-anchor="middle">LangGraph</text>

      <!-- Pill 3: Gemini APIs -->
      <rect x="200" y="0" width="102" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="251" y="15" fill="#E2E8F0" text-anchor="middle">Gemini APIs</text>

      <!-- Pill 4: Vector DBs -->
      <rect x="310" y="0" width="98" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="359" y="15" fill="#E2E8F0" text-anchor="middle">Vector DBs</text>

      <!-- Pill 5: Python -->
      <rect x="416" y="0" width="75" height="22" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="453.5" y="15" fill="#E2E8F0" text-anchor="middle">Python</text>
    </g>
  </g>
</svg>
