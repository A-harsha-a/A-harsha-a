<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Card Background Overlay -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Hero Title Gradient -->
    <linearGradient id="hero-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#818CF8"/>
      <stop offset="65%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Subtitle Pill Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="33%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="66%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Radial Glow Orbs -->
    <radialGradient id="orb-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <!-- Node Gradient Accents -->
    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="node-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Base Outer Canvas -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)" />
  <rect x="1.5" y="1.5" width="1197" height="357" rx="17" fill="none" stroke="url(#border-glow)" stroke-width="2"/>

  <!-- Geometric Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <path d="M 0,45 L 1200,45 M 0,90 L 1200,90 M 0,135 L 1200,135 M 0,180 L 1200,180 M 0,225 L 1200,225 M 0,270 L 1200,270 M 0,315 L 1200,315" />
    <path d="M 90,0 L 90,360 M 180,0 L 180,360 M 270,0 L 270,360 M 360,0 L 360,360 M 450,0 L 450,360 M 540,0 L 540,360 M 630,0 L 630,360 M 720,0 L 720,360 M 810,0 L 810,360 M 900,0 L 900,360 M 990,0 L 990,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Glowing Radial Orbs -->
  <circle cx="150" cy="80" r="180" fill="url(#orb-blue)"/>
  <circle cx="1050" cy="180" r="200" fill="url(#orb-purple)"/>

  <!-- Left Accent Vertical Glow Bar -->
  <rect x="0" y="50" width="5" height="260" rx="2.5" fill="url(#hero-title-grad)"/>

  <!-- RIGHT SIDE: AGENTIC AI STATE GRAPH VISUALIZATION -->
  <g transform="translate(770, 25)">
    <!-- Card Frame for Graph -->
    <rect x="0" y="20" width="390" height="270" rx="14" fill="url(#card-bg)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.7"/>
    
    <!-- Header of Graph Widget -->
    <text x="20" y="48" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.2">LANGGRAPH AGENT STATE FLOW</text>
    <circle cx="365" cy="44" r="4" fill="#10B981"/>

    <!-- Graph Connecting Lines (Edges) -->
    <!-- Input -> Router -->
    <line x1="55" y1="150" x2="135" y2="100" stroke="#38BDF8" stroke-width="2.2" opacity="0.85"/>
    <line x1="55" y1="150" x2="135" y2="200" stroke="#818CF8" stroke-width="2.2" opacity="0.85"/>
    
    <!-- Router -> Tools / RAG -->
    <line x1="135" y1="100" x2="235" y2="90" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6 5"/>
    <line x1="135" y1="200" x2="235" y2="210" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="6 5"/>
    
    <!-- Tools -> Evaluator Node -->
    <line x1="235" y1="90" x2="330" y2="150" stroke="#38BDF8" stroke-width="2.2" opacity="0.85"/>
    <line x1="235" y1="210" x2="330" y2="150" stroke="#C084FC" stroke-width="2.2" opacity="0.85"/>

    <!-- Conditional Loop Edge -->
    <path d="M 330,150 Q 235,150 135,100" fill="none" stroke="#F472B6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75"/>

    <!-- Graph Nodes -->
    <!-- Node 1: State Input -->
    <g transform="translate(55, 150)">
      <circle cx="0" cy="0" r="20" fill="url(#node-cyan)"/>
      <circle cx="0" cy="0" r="10" fill="#07090e"/>
      <text x="0" y="34" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">State Init</text>
    </g>

    <!-- Node 2: LLM Router Agent -->
    <g transform="translate(135, 100)">
      <circle cx="0" cy="0" r="22" fill="url(#node-indigo)"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">LLM</text>
      <text x="0" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Router</text>
    </g>

    <!-- Node 3: RAG Retriever Tool -->
    <g transform="translate(235, 90)">
      <rect x="-20" y="-15" width="40" height="30" rx="7" fill="#0284C7" stroke="#38BDF8" stroke-width="1.2"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">RAG</text>
      <text x="0" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Vector Search</text>
    </g>

    <!-- Node 4: Python Code Exec Tool -->
    <g transform="translate(135, 200)">
      <circle cx="0" cy="0" r="18" fill="url(#node-purple)"/>
      <text x="0" y="4" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tool</text>
      <text x="0" y="32" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Python Exec</text>
    </g>

    <!-- Node 5: Output Evaluator -->
    <g transform="translate(235, 210)">
      <rect x="-22" y="-15" width="44" height="30" rx="7" fill="#7C3AED" stroke="#C084FC" stroke-width="1.2"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Eval</text>
      <text x="0" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#94A3B8" text-anchor="middle">Guardrails</text>
    </g>

    <!-- Node 6: Final Response -->
    <g transform="translate(330, 150)">
      <circle cx="0" cy="0" r="22" fill="url(#hero-title-grad)"/>
      <circle cx="0" cy="0" r="11" fill="#0F172A"/>
      <text x="0" y="36" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#F472B6" text-anchor="middle">Output</text>
    </g>
  </g>

  <!-- LEFT SIDE: MAIN HERO CONTENT -->
  <g transform="translate(55, 0)">
    
    <!-- TOP PILL: Status & Role Title -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="360" height="32" rx="16" fill="url(#badge-grad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="18" cy="16" r="4.5" fill="#10B981"/>
      <text x="32" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
        AI &amp; MACHINE LEARNING ENGINEER
      </text>
    </g>

    <!-- HERO NAME -->
    <text x="0" y="140" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#hero-title-grad)" letter-spacing="-1">
      Aradhyula Harsha
    </text>

    <!-- TAGLINE / CORE SPECIALIZATIONS -->
    <text x="0" y="180" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#CBD5E1" letter-spacing="0.2">
      Generative AI • Agentic Workflows • RAG Architectures • LLM Orchestration
    </text>

    <!-- ACADEMIC & EXPERIENCE BADGE STRIP -->
    <g transform="translate(0, 208)">
      <text x="0" y="14" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
        🎓 B.Tech AI &amp; ML (2024–2028) &nbsp;•&nbsp; 💼 GenAI Intern @ Nacre &nbsp;•&nbsp; 📍 India
      </text>
    </g>

    <!-- CORE STACK PILLS -->
    <g transform="translate(0, 252)">
      <!-- Pill 1: LangGraph -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="59" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle">⚡ LangGraph</text>
      </g>

      <!-- Pill 2: LangChain -->
      <g transform="translate(130, 0)">
        <rect x="0" y="0" width="118" height="32" rx="8" fill="#1E293B" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="59" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818CF8" text-anchor="middle">🦜 LangChain</text>
      </g>

      <!-- Pill 3: Google Gemini -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="142" height="32" rx="8" fill="#1E293B" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="71" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#C084FC" text-anchor="middle">✨ Google Gemini</text>
      </g>

      <!-- Pill 4: Vector RAG -->
      <g transform="translate(414, 0)">
        <rect x="0" y="0" width="132" height="32" rx="8" fill="#1E293B" stroke="#F472B6" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="66" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F472B6" text-anchor="middle">📚 RAG Systems</text>
      </g>

      <!-- Pill 5: Python -->
      <g transform="translate(558, 0)">
        <rect x="0" y="0" width="102" height="32" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.8"/>
        <text x="51" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle">🐍 Python</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric / Certification Bar -->
  <g transform="translate(55, 320)">
    <line x1="0" y1="0" x2="1090" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6"/>
    <text x="0" y="22" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">
      CERTIFIED: <tspan fill="#CBD5E1">Oracle APEX &amp; Generative AI Professional</tspan> &nbsp;|&nbsp; <tspan fill="#CBD5E1">Google AI Essentials</tspan> &nbsp;|&nbsp; <tspan fill="#CBD5E1">IIT Kharagpur DBMS</tspan>
    </text>
  </g>
</svg>
